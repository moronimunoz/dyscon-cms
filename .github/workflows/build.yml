# Genera Y PUBLICA el sitio en dos casos:
#   1) A mano: pestaña Actions > "Generar páginas" > Run workflow > Run workflow
#   2) Solo, cuando se sube (con commit y push desde VS Code) un cambio de código o de las páginas del sitio.
# Editar en Pages CMS (obras, novedades, fotos) NO publica nada: se acumula en el repositorio hasta que
# se publique por alguno de los dos caminos de arriba, y en ese momento sale todo lo acumulado.
# (Requiere Settings > Pages > Source: "GitHub Actions".)
name: Generar páginas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/css/**'
      - 'docs/js/**'
      - 'docs/*.html'
      - 'build.js'
      - 'optimizar-imagenes.js'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      # Estos los genera el propio sitio: no deben disparar otra corrida
      - '!docs/js/*-data.js'
      - '!docs/obra-*.html'
      - '!docs/novedad-*.html'
permissions:
  contents: write
  pages: write
  id-token: write
# Si se dispara dos veces seguidas, las corridas hacen cola en vez de pisarse
concurrency:
  group: generar-paginas
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # siempre la última versión, incluso si otra corrida terminó hace un instante
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Si las fotos fallan por cualquier motivo, igual se publica el contenido (el sitio usa la foto original)
      - name: Optimizar fotos
        continue-on-error: true
        run: |
          npm ci
          node optimizar-imagenes.js
      # Busca en OpenStreetMap la ubicación exacta de las obras nuevas (cada dirección se busca una sola vez
      # y queda en scripts/geocache.json). Si no hay respuesta, el mapa usa el centro de la ciudad y se publica igual.
      - name: Ubicar obras en el mapa
        continue-on-error: true
        run: node scripts/geocodificar.js
      - run: node build.js
        env:
          # Se arma sola según el repositorio: .../dyscon-cms acá, .../dyscon en el original
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Subir lo generado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A docs
          if [ -f scripts/geocache.json ]; then git add scripts/geocache.json; fi
          git diff --cached --quiet || (git commit -m "Páginas generadas" && git pull --rebase && git push)

  # Publica el sitio. Va después de "build", dentro de la misma cola: nunca hay dos publicaciones a la vez.
  publicar:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4