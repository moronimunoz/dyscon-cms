# Regenera el sitio cada vez que cambia el contenido (panel Pages CMS) o las plantillas.
# También se puede correr a mano: pestaña Actions > "Generar páginas" > Run workflow.
name: Generar páginas
on:
  push:
    branches: [main]
    paths: ['content/**', 'docs/obra.html', 'docs/novedad.html', 'docs/nosotros.html', 'build.js', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generar-paginas
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.js
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Subir lo generado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A docs
          git diff --cached --quiet || (git commit -m "Páginas generadas" && git pull --rebase && git push)
